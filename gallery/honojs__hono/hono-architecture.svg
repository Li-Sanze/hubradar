  <a class="card-anchor" href="https://github.com/honojs/hono/blob/5ca49b0720755c585c9a9835f0a479ceea36fb52/src/hono-base.ts#L437-L448" target="_blank" rel="noopener">
    <g transform="translate(60, 250)">
