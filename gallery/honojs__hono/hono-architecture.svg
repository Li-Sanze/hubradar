<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="max-width:100%;height:auto;display:block;margin:0 auto;" role="img" aria-label="Hono 核心系统架构与全景分层 (5ca49b07)">
  <title>Hono 核心系统架构与全景分层 (5ca49b07)</title>
