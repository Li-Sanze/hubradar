      <rect x="12" y="12" width="20" height="20" rx="4" fill="#2563eb"/>
      <text x="22" y="26" text-anchor="middle" class="badge-text">1</text>
      <text x="38" y="26" class="card-title" fill="#1e40af">HonoBase #dispatch 调度</text>
