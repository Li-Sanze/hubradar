      <rect x="12" y="12" width="20" height="20" rx="4" fill="#059669"/>
      <text x="22" y="26" text-anchor="middle" class="badge-text">3</text>
      <text x="38" y="26" class="card-title" fill="#166534">Context 惰性上下文容器</text>
      <text x="14" y="48" class="card-desc">??= 按需初始化 headers、变量 Map、body</text>
      <rect x="12" y="62" width="246" height="32" rx="4" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="0.8"/>
      <text x="20" y="81" class="code-pill">this.#req ??= new HonoRequest(...)</text>
    </g>
