  <!-- 容器分层：请求执行管道分化：单处理器快路径 VS 洋葱中间件 -->
  <rect x="40" y="425" width="920" height="200" rx="10" stroke-width="1.5" class="layer-container" filter="url(#card-shadow-hono)" data-graph-role="container"/>
  <text x="60" y="449" class="layer-title">请求执行管道分化：单处理器快路径 VS 洋葱中间件</text>
  <a class="card-anchor" href="https://github.com/honojs/hono/blob/5ca49b0720755c585c9a9835f0a479ceea36fb52/src/hono-base.ts#L449-L466" target="_blank" rel="noopener">
    <g transform="translate(60, 460)">
