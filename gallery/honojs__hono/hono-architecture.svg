      <text x="15" y="23" class="card-title" fill="#166534">单处理器快路径特化 (Fast Path)</text>
      <text x="14" y="42" class="card-desc">当 matchResult[0].length === 1 时完全绕过 compose</text>
      <rect x="12" y="64" width="396" height="34" rx="4" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="0.8"/>
      <text x="20" y="83" class="code-pill">res = matchResult[0][0][0][0](c, async () =&gt; {})</text>
      <text x="20" y="114" class="card-desc" fill="#166534">零中间件级联调度开销 · 直接返回 Response 对象</text>
    </g>
  </a>
  <a class="card-anchor" href="https://github.com/honojs/hono/blob/5ca49b0720755c585c9a9835f0a479ceea36fb52/src/compose.ts#L32-L71" target="_blank" rel="noopener">
    <g transform="translate(510, 460)">
      <rect width="430" height="145" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2" class="card-rect"/>
      <text x="15" y="23" class="card-title" fill="#5b21b6">洋葱式中间件级联调度 (compose)</text>
      <text x="14" y="42" class="card-desc">compose(matchResult[0]) 串联执行与错误捕获</text>
      <rect x="12" y="64" width="406" height="34" rx="4" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="0.8"/>
      <text x="20" y="83" class="code-pill">res = await handler(context, () =&gt; dispatch(i + 1))</text>
      <text x="20" y="114" class="card-desc" fill="#5b21b6">严格维护 context.finalized 状态机 · 错误冒泡守卫</text>
    </g>
  </a>
