  <a class="card-anchor" href="https://github.com/honojs/hono/blob/5ca49b0720755c585c9a9835f0a479ceea36fb52/src/router/smart-router/router.ts#L21-L49" target="_blank" rel="noopener">
    <g transform="translate(365, 250)">
      <rect width="270" height="110" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2" class="card-rect"/>
      <rect x="12" y="12" width="20" height="20" rx="4" fill="#7c3aed"/>
      <text x="22" y="26" text-anchor="middle" class="badge-text">2</text>
      <text x="38" y="26" class="card-title" fill="#5b21b6">SmartRouter 组合路由</text>
      <text x="14" y="48" class="card-desc">RegExpRouter(预编译) + TrieRouter(回退)</text>
      <rect x="12" y="62" width="246" height="32" rx="4" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="0.8"/>
      <text x="20" y="81" class="code-pill">this.match = router.match.bind(router)</text>
    </g>
