<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 722" width="1000" height="722" style="max-width:100%;height:auto;display:block;margin:0 auto;" role="img" aria-label="HubRadar 核心系统架构与工作流全景 (93ef1e1)">
